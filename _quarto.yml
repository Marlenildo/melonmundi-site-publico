project:
  type: website
  output-dir: docs
  # Lista explícita: evita que arquivos internos do repositório (AGENTS.md,
  # README.md) virem páginas publicadas na Vercel.
  render:
    - index.qmd
    - sobre-nos.qmd
    - politica-de-privacidade.qmd
    - termos-de-uso.qmd
    - licenca.qmd
    - CHANGELOG.md
  resources:
    - assets/img/logo_marlenildo.png
lang: pt-BR

website:
  title: "MelonMundi Global Solutions | Soluções inovadoras em melão, melancia e abóbora"
  description: "Plataforma institucional de gestão agrícola em produção de cucurbitáceas e rastreabilidade técnica baseada em dados."
  site-url: "https://melonmundi.com"
  favicon: assets/img/favicon.ico
  search: false
  page-navigation: true
  cookie-consent:
    type: express
    style: simple
    language: pt
    title: "Cookies e privacidade"
    description: "Este site utiliza cookies essenciais para garantir o funcionamento adequado e melhorar a sua experiência de navegação."
    accept-label: "Aceitar"
    decline-label: "Recusar"
    learn-more-label: "Saiba mais"
    learn-more-url: "/politica-de-privacidade.html"

  navbar:
    pinned: true
    collapse: true
    collapse-below: lg
    background: none
    foreground: "#548238"
    logo: "assets/img/nova_logomm.png"
    logo-alt: "MelonMundi - Global Solutions logo."
    toggle-position: right
    left:
      - text: "Página Inicial"
        href: index.qmd
      - text: "Quem Somos"
        href: sobre-nos.qmd
      - text: "Informações"
        menu:
          - text: "Política de Privacidade"
            href: politica-de-privacidade.qmd
          - text: "Termos de Uso"
            href: termos-de-uso.qmd
          - text: "Licenças e Créditos"
            href: licenca.qmd
    # Atalho "Entrar" exibido fora do menu sanfonado no celular.
    # No desktop ele fica oculto por CSS e vale o item de `right:`.
    tools:
      - text: "Entrar"
        icon: box-arrow-in-right
        href: https://acervo.melonmundi.com
    right:
      - text: "Entrar"
        href: https://acervo.melonmundi.com
        icon: box-arrow-in-right

  page-footer:
    left: |
      <div class="footer-brand">
        <img src="/assets/img/nova_logomm.png" alt="MelonMundi - Global Solutions" class="footer-logo" width="120" height="108">
        <p class="footer-tagline">Grupo multidisciplinar com dedicação exclusiva às culturas de melão, melancia e abóbora — do planejamento da fazenda à pós-colheita.</p>
      </div>
    center:
      - text: "Página Inicial"
        href: /index.html
      - text: "Quem Somos"
        href: /sobre-nos.html
      - text: "Privacidade"
        href: /politica-de-privacidade.html
      - text: "Termos de Uso"
        href: /termos-de-uso.html
      - text: "Licenças e Créditos"
        href: /licenca.html
    right: |
      <div class="footer-cta">
        <p class="footer-heading">Acervo MelonMundi</p>
        <p class="footer-cta-text">Biblioteca técnica, simuladores, cursos e aplicativos reunidos em um único login.</p>
        <a class="footer-cta-btn" href="https://acervo.melonmundi.com"><i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i> Entrar no Acervo</a>
      </div>

format:
  html:
    lang: pt-BR
    css: assets/css/styles.css
    toc: true
    smooth-scroll: true
    link-external-newwindow: true

    # SEO & social sharing
    open-graph: true
    twitter-card: true

    # Usabilidade (opcional, já validado)
    reader-mode: true
    page-navigation: true
    include-after-body:
      - text: |
          <script src="assets/js/scroll-reveal.js"></script>
      - text: |
          <script src="assets/js/home-navbar-scroll.js"></script>
      - text: |
          <script src="assets/js/home-carousel.js"></script>
      - text: |
          <script src="assets/js/legal-toc.js"></script>
      - text: |
          <template id="footer-credit-template">
            <div class="footer-credit-line">
              <p class="footer-copyright">&copy; 2026 MelonMundi &ndash; Global Solutions. Todos os direitos reservados.</p>
              <span class="footer-credit-dev">
                <span class="footer-credit-text">Desenvolvido por</span>
                <a href="https://github.com/Marlenildo" class="footer-credit-link" aria-label="GitHub de Marlenildo">
                  <img src="/assets/img/logo_marlenildo.png" alt="Marlenildo - Soluções em Curso" class="footer-credit-logo">
                </a>
              </span>
            </div>
          </template>
      - text: |
          <script src="assets/js/footer-credit.js"></script>
    include-in-header:
      - text: |
          <!-- Matomo -->
          <script>
            var _paq = window._paq = window._paq || [];
            /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
            _paq.push(['trackPageView']);
            _paq.push(['enableLinkTracking']);
            (function() {
              var u="//acervo.melonmundi.com/matomo/";
              _paq.push(['setTrackerUrl', u+'matomo.php']);
              _paq.push(['setSiteId', '3']);
              var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
              g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
            })();
          </script>
          <!-- End Matomo Code -->
      - text: |
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      - text: |
          <noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>
